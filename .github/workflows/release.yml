name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install WiX Toolset 3
        run: choco install wixtoolset --version=3.14.1 -y --no-progress
      - name: Test collector
        working-directory: collector
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version" }
      - name: Build MSI
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction Stop
          .\build-gemini-addon-msi.ps1 -WixBin (Split-Path -Parent $candle.Source)
          $msi = "target\GeminiUsageMonitor-$((Get-Content VERSION -Raw).Trim()).msi"
          (Get-FileHash -Algorithm SHA256 $msi).Hash + "  " + (Split-Path -Leaf $msi) | Set-Content "$msi.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $msi = "target\GeminiUsageMonitor-$version.msi"
          gh release create $env:GITHUB_REF_NAME $msi "$msi.sha256" --title "Gemini Usage Monitor $version" --notes-file RELEASE_NOTES.md
